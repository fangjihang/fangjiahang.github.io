<head>
<meta charset="UTF-8">

<title>闲鱼显卡商品数据 - 多月份价格趋势</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --surface-page:   #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --border-ring:    rgba(11,11,11,0.10);
    --s1: #2a78d6; --s1-fill: #2a78d61a;
    --s2: #eb6834; --s2-fill: #eb68341a;
    --s3: #1baf7a; --s3-fill: #1baf7a1a;
    --s4: #eda100; --s4-fill: #eda1001a;
    --s5: #e87ba4; --s5-fill: #e87ba41a;
    --s6: #008300; --s6-fill: #0083001a;
    --s7: #4a3aa7; --s7-fill: #4a3aa71a;
    --s8: #e34948; --s8-fill: #e349481a;
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-page:   #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border-ring:    rgba(255,255,255,0.10);
    --s1: #3987e5; --s1-fill: #3987e51a;
    --s2: #d95926; --s2-fill: #d959261a;
    --s3: #199e70; --s3-fill: #199e701a;
    --s4: #c98500; --s4-fill: #c985001a;
    --s5: #d55181; --s5-fill: #d551811a;
    --s6: #008300; --s6-fill: #0083001a;
    --s7: #9085e9; --s7-fill: #9085e91a;
    --s8: #e66767; --s8-fill: #e667671a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-page:   #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border-ring:    rgba(255,255,255,0.10);
    --s1: #3987e5; --s1-fill: #3987e51a;
    --s2: #d95926; --s2-fill: #d959261a;
    --s3: #199e70; --s3-fill: #199e701a;
    --s4: #c98500; --s4-fill: #c985001a;
    --s5: #d55181; --s5-fill: #d551811a;
    --s6: #008300; --s6-fill: #0083001a;
    --s7: #9085e9; --s7-fill: #9085e91a;
    --s8: #e66767; --s8-fill: #e667671a;
}

body {
  background: var(--surface-page);
  color: var(--text-primary);
  padding: 32px 24px 64px;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  max-width: 1200px;
  margin: 0 auto 32px;
}
.header h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
.header p {
  margin-top: 4px;
  font-size: 14px;
  color: var(--text-secondary);
}

/* ── Stat tiles ── */
.stats-row {
  max-width: 1200px;
  margin: 0 auto 32px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.stat-tile {
  background: var(--surface-1);
  border: 1px solid var(--border-ring);
  border-radius: 8px;
  padding: 16px 20px;
}
.stat-tile .stat-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.stat-tile .stat-value {
  font-size: 26px;
  font-weight: 600;
  color: var(--text-primary);
  margin-top: 4px;
}
.stat-tile .stat-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ── Chart section ── */
.chart-section {
  max-width: 1200px;
  margin: 0 auto 24px;
  background: var(--surface-1);
  border: 1px solid var(--border-ring);
  border-radius: 8px;
  padding: 24px;
}
.chart-section h2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.chart-section .chart-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

/* ── Legend ── */
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-bottom: 16px;
}
.chart-legend .legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: opacity 0.15s;
  user-select: none;
}
.chart-legend .legend-item.dimmed {
  opacity: 0.35;
}
.chart-legend .legend-line {
  width: 16px;
  height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}
.chart-container {
  position: relative;
  width: 100%;
  height: 380px;
}
.chart-container svg {
  width: 100%;
  height: 100%;
}

/* tooltip */
.chart-tooltip {
  display: none;
  position: absolute;
  background: var(--surface-1);
  border: 1px solid var(--border-ring);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  pointer-events: none;
  z-index: 10;
  box-shadow: 0 2px 12px rgba(0,0,0,0.10);
  min-width: 160px;
}
.chart-tooltip .tt-month {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.chart-tooltip .tt-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
}
.chart-tooltip .tt-line {
  width: 10px;
  height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}
.chart-tooltip .tt-model {
  font-size: 12px;
  color: var(--text-secondary);
  flex: 1;
}
.chart-tooltip .tt-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

/* ── filter chips ── */
.month-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.month-chip {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border-ring);
  background: var(--surface-1);
  color: var(--text-secondary);
  transition: all 0.15s;
  user-select: none;
}
.month-chip:hover {
  background: var(--gridline);
}
.month-chip.active {
  background: var(--s1);
  color: #fff;
  border-color: var(--s1);
}

/* ── Card grid ── */
.card-section {
  max-width: 1200px;
  margin: 0 auto;
}
.card-section h2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.card-section .card-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
}
.card {
  background: var(--surface-1);
  border: 1px solid var(--border-ring);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.15s;
}
.card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.card-img-wrap {
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: #f0efec;
  display: flex;
  align-items: center;
  justify-content: center;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .card-img-wrap { background: #2c2c2a; }
}
:root[data-theme="dark"] .card-img-wrap { background: #2c2c2a; }
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  padding: 10px;
  background: linear-gradient(145deg, #f8f8f7, #ebecea);
}
.card-img-wrap .gpu-svg-fallback {
  width: 100%;
  height: 100%;
}
.card-img-wrap .gpu-svg-fallback svg {
  width: 100%;
  height: 100%;
  display: block;
}
.card-img-wrap .img-fallback {
  color: var(--text-muted);
  font-size: 48px;
}
.card-body {
  padding: 12px 14px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-price {
  font-size: 20px;
  font-weight: 600;
  color: var(--s2);
  line-height: 1;
}
.card-price::before {
  content: '¥';
  font-size: 13px;
  font-weight: 500;
}
.card-month {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--gridline);
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.card-model-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--s1);
}
.card-title {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-addr {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: auto;
}
.card-addr::before {
  content: '📍';
  font-size: 11px;
}

/* ── Footer ── */
.footer {
  max-width: 1200px;
  margin: 40px auto 0;
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
}

/* ── Responsive ── */
@media (max-width: 640px) {
  body { padding: 16px 12px 48px; }
  .header h1 { font-size: 22px; }
  .stat-tile .stat-value { font-size: 22px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .card-price { font-size: 18px; }
  .chart-container { height: 280px; }
  .chart-legend { gap: 2px 10px; }
  .chart-legend .legend-item { font-size: 11px; }
}
</style>
</head>

// ── Generate GPU card SVG by model ──
function getGpuSvg(model) {

  if (model.includes('5080') || model.includes('5070')) fn = 3;
  else if (model.includes('5060') || model.includes('3060')) fn = 2;

const MODEL_IMAGE_POOL = ALL_DATA.reduce((pool, item) => {
  if (item.img && /^https?:\/\//.test(item.img)) {
    (pool[item.model] || (pool[item.model] = [])).push(item.img.replace(/^http:/, 'https:'));
  }

}, {});

function getRealGpuImage(item, index) {
  if (item.img && /^https?:\/\//.test(item.img)) return item.img.replace(/^http:/, 'https:');
  const pool = MODEL_IMAGE_POOL[item.model] || [];
  return pool.length ? pool[index % pool.length] : '';
}

// ── Render trend chart ──
(function() {
  const svg = document.getElementById('trendChart');
  const container = document.getElementById('chartContainer');
  const tooltip = document.getElementById('chartTooltip');
  const ttMonth = tooltip.querySelector('.tt-month');
  const ttRows = document.getElementById('ttRows');
  const legendEl = document.getElementById('chartLegend');

  const margin = { top: 16, right: 80, bottom: 40, left: 66 };
  const W = container.clientWidth;
  const H = container.clientHeight;
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.display = 'block';

  // Y range
  const allAvgs = TREND_DATA.flatMap(m => m.points.map(p => p.avg)).filter(v => v !== null);
  const yMin = Math.floor(Math.min(...allAvgs) / 500) * 500;
  const yMax = Math.ceil(Math.max(...allAvgs) / 500) * 500;
  const yRange = yMax - yMin || 500;

  const nMonths = TREND_DATA[0].points.length;  // 7
  const xStep = w / (nMonths - 1);
  const xScale = i => margin.left + i * xStep;
  const yScale = v => margin.top + h - ((v - yMin) / yRange) * h;

  // ── Build legend ──
  TREND_MODELS.forEach((model, i) => {
    const item = document.createElement('span');
    item.className = 'legend-item';
    item.dataset.index = i;
    item.innerHTML = `<span class="legend-line" style="background:var(--s${i+1})"></span>${model}`;
    item.addEventListener('click', () => {
      const dimmed = item.classList.toggle('dimmed');
      // dim/brighten the corresponding line group
      const lines = svg.querySelectorAll(`[data-series="${i}"]`);
      lines.forEach(el => el.setAttribute('opacity', dimmed ? '0.15' : '1'));
    });
    legendEl.appendChild(item);
  });

  // ── Gridlines ──
  let svgHtml = '';
  const yTicks = 6;
  for (let i = 0; i <= yTicks; i++) {
    const val = yMin + (yRange / yTicks) * i;
    const y = yScale(val);
    svgHtml += `<line x1="${margin.left}" x2="${margin.left + w}" y1="${y}" y2="${y}" stroke="var(--gridline)" stroke-width="1"/>`;
    svgHtml += `<text x="${margin.left - 8}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="11" font-family="inherit">¥${val.toLocaleString()}</text>`;
  }

  // ── X-axis labels ──
  TREND_DATA[0].points.forEach((pt, i) => {
    const x = xScale(i);
    svgHtml += `<text x="${x}" y="${margin.top + h + 20}" text-anchor="middle" fill="var(--text-muted)" font-size="11" font-family="inherit">${pt.label}</text>`;
  });

  // ── Baseline ──
  svgHtml += `<line x1="${margin.left}" x2="${margin.left + w}" y1="${yScale(yMin)}" y2="${yScale(yMin)}" stroke="var(--baseline)" stroke-width="1"/>`;

  // ── Lines per series ──
  TREND_DATA.forEach((series, si) => {
    const validPts = series.points.map((p, i) => ({i, avg: p.avg})).filter(p => p.avg !== null);
    if (validPts.length < 2) return;

    // Area fill
    let areaPath = `M${xScale(validPts[0].i)},${yScale(yMin)}`;
    for (const pt of validPts) areaPath += ` L${xScale(pt.i)},${yScale(pt.avg)}`;
    areaPath += ` L${xScale(validPts[validPts.length-1].i)},${yScale(yMin)} Z`;
    svgHtml += `<path d="${areaPath}" fill="var(--s${si+1}-fill)" stroke="none" data-series="${si}"/>`;

    // Line
    let linePath = '';
    for (let j = 0; j < validPts.length; j++) {
      linePath += (j === 0 ? 'M' : 'L') + `${xScale(validPts[j].i).toFixed(1)},${yScale(validPts[j].avg).toFixed(1)}`;
    }
    svgHtml += `<path d="${linePath}" fill="none" stroke="var(--s${si+1})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-series="${si}"/>`;

    // End dot
    const last = validPts[validPts.length - 1];
    const lx = xScale(last.i), ly = yScale(last.avg);
    svgHtml += `<circle cx="${lx}" cy="${ly}" r="5" fill="var(--surface-1)" stroke="var(--s${si+1})" stroke-width="2" data-series="${si}"/>`;
    svgHtml += `<circle cx="${lx}" cy="${ly}" r="3" fill="var(--s${si+1})" stroke="none" data-series="${si}"/>`;

    // Direct end label for top 4 series (avoid clutter)
    if (si < 4) {
      svgHtml += `<text x="${lx + 8}" y="${ly + 4}" fill="var(--text-secondary)" font-size="11" font-weight="500" font-family="inherit" data-series="${si}">${series.model}</text>`;
    }
  });

  // X-axis title
  svgHtml += `<text x="${margin.left + w/2}" y="${H - 4}" text-anchor="middle" fill="var(--text-muted)" font-size="11" font-family="inherit">月份</text>`;

  svg.innerHTML = svgHtml;

  // ── Interaction: crosshair + tooltip ──
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
  container.style.position = 'relative';
  container.appendChild(overlay);

  const crosshair = document.createElement('div');
  crosshair.style.cssText = 'position:absolute;top:0;width:1px;height:100%;background:var(--text-muted);opacity:0.3;pointer-events:none;display:none;';
  container.appendChild(crosshair);

  overlay.addEventListener('mousemove', function(e) {
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (mx < margin.left || mx > margin.left + w || my < margin.top || my > margin.top + h) {
      crosshair.style.display = 'none';
      tooltip.style.display = 'none';
      return;
    }

    // Find nearest month
    let nearest = 0, minDist = Infinity;
    for (let i = 0; i < nMonths; i++) {
      const dist = Math.abs(mx - xScale(i));
      if (dist < minDist) { minDist = dist; nearest = i; }
    }

    const sx = xScale(nearest);
    crosshair.style.display = 'block';
    crosshair.style.left = sx + 'px';

    const ptLabel = TREND_DATA[0].points[nearest].label;
    ttMonth.textContent = ptLabel;

    let rowsHtml = '';
    TREND_DATA.forEach((series, si) => {
      const val = series.points[nearest].avg;
      if (val !== null) {
        rowsHtml += `<div class="tt-row">
          <span class="tt-line" style="background:var(--s${si+1})"></span>
          <span class="tt-model">${series.model}</span>
          <span class="tt-val">¥${val.toLocaleString()}</span>
        </div>`;
      }
    });
    ttRows.innerHTML = rowsHtml;

    tooltip.style.display = 'block';
    const tx = sx + 14;
    tooltip.style.left = Math.min(tx, W - 175) + 'px';
    tooltip.style.top = '8px';
  });

  overlay.addEventListener('mouseleave', function() {
    crosshair.style.display = 'none';
    tooltip.style.display = 'none';
  });
})();
</script>

</body>
</html>
