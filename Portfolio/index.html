    <script>
        function createParticles() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 50; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (5 + Math.random() * 5) + 's';
                particle.style.width = (2 + Math.random() * 3) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = Math.random() > 0.5 ? '#00d2ff' : '#a55eea';
                container.appendChild(particle);
            }
        }
        
        function animateNumbers() {
            document.querySelectorAll('.stat-value').forEach(function(el) {
                var target = parseFloat(el.textContent.replace(/[^0-9.]/g, ''));
                var current = 0;
                var duration = 2000;
                var startTime = performance.now();
                
                function update(currentTime) {
                    var elapsed = currentTime - startTime;
                    var progress = Math.min(elapsed / duration, 1);
                    progress = 1 - Math.pow(1 - progress, 3);
                    current = target * progress;
                    
                    if (el.textContent.includes('¥')) {
                        el.textContent = '¥' + Math.round(current);
                    } else if (el.textContent.includes('%')) {
                        el.textContent = current.toFixed(1) + '%';
                    } else {
                        el.textContent = Math.round(current);
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(update);
                    }
                }
                requestAnimationFrame(update);
            });
        }

 Demo   Procedure Follow the instructions...", "full_content": "Developing application specific plugins Demo   Procedure Follow the instructions for a Tersus Studio - Cross Platform Installation, replacing the Eclipse Platform Runtime Binary build specified there, with an Eclipse SDK build (or another build supporting Java development). Start with a Java project and add a folder models to make it a Tersus project as well. Create a Java class that extends tersus.runtime.Plugin (the attached demo project includes 3 such classes: Factorial, Fibonacci, Transform). Create a TPD file describing the plugin created in the previous step. At a minimum, the TPD file should contain a reference to the Java class that implements the plugin (see in models/Plugins folder in the attached demo project). Connect an action to the plugin, by dragging a Basic/Action to the model, and changing its plugin property. Setting the property to Plugins/X means the TPD file is located in either models/Plugins/X/X.tpd or models/Plugins/X.tpd - whichever exists. The folder models/Plugins/X/ is typically used to hold icon files and/or documentation. Add the necessa*****iggers and exits, per the plugin implementation. (Optional) Add icons (always nice, but time-consuming) (Optional) Create a template/prototype (if the plugin is only used once this is redundant) Notes Whenever the Java implementation is changed, the Tersus application needs to be restarted in order to load the new version. 3rd party Jar files can be added to a jars folder in the project (as in the demo project) The whole project can be packaged as a library (.tersus) file, via File > Export > Tersus > Tersus Project File, and re-used in other Tersus projects. The API for interacting with Tersus is somewhat complicated but results in relatively efficient access (all element access is using fixed array indices rather than hash lookups): The plugin's initializeFromModel method is called when the application is started, and is used to ini         var currentPage = 1;
        var pageSize = 20;
        
        function renderTable() {
            var wordFilter = document.getElementById('filterWord').value;
            var statusFilter = document.getElementById('filterStatus').value;
            var searchText = document.getElementById('searchInput').value.toLowerCase();
            
            var filtered = tableData.filter(function(row) {
                if (wordFilter && row.word !== wordFilter) return false;
                if (statusFilter && row.status !== statusFilter) return false;
                if (searchText && !(row.title.toLowerCase().includes(searchText) || row.content.toLowerCase().includes(searchText))) return false;
                return true;
            });
            
            var totalPages = Math.ceil(filtered.length / pageSize);
            currentPage = Math.min(currentPage, Math.max(1, totalPages));
            var start = (currentPage - 1) * pageSize;
            var end = start + pageSize;
            var pageData = filtered.slice(start, end);
            
            var tbody = document.getElementById('dataTable').querySelector('tbody');
            tbody.innerHTML = '';
            
            pageData.forEach(function(row) {
                var tr = document.createElement('tr');
                var wordClass = row.word === '爬虫' ? 'word-crawler' : 'word-python';
                var statusClass = row.status === '进行中' ? 'status-in-progress' : 'status-completed';
                
                tr.innerHTML = '<td><span class="word-tag ' + wordClass + '">' + row.word + '</span></td>' +
                    '<td class="col-title">' + row.title + '</td>' +
                    '<td class="price-highlight">' + row.price + '</td>' +
                    '<td>' + row.catetype + '</td>' +
                    '<td class="col-content"><span class="tooltip" data-tooltip="' + row.full_content.replace(/"/g, '&quot;') + '">' + row.content + '</span></td>' +
                    '<td><span class="status-badge ' + statusClass + '">' + row.status + '</span></td>' +
                    '<td><a href="' + row.url + '" target="_blank">查看详情</a></td>';
                tbody.appendChild(tr);
            });
            
            renderPagination(totalPages);
        }
        
        function renderPagination(totalPages) {
            var pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            if (currentPage > 1) {
                var prevBtn = document.createElement('button');
                prevBtn.className = 'page-btn';
                prevBtn.textContent = '上一页';
                prevBtn.onclick = function() { currentPage--; renderTable(); };
                pagination.appendChild(prevBtn);
            }
            
            for (var i = 1; i <= totalPages; i++) {
                if (i <= 3 || (i > currentPage - 2 && i < currentPage + 2) || i > totalPages - 2) {
                    var btn = document.createElement('button');
                    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                    btn.textContent = i;
                    btn.onclick = (function(page) {
                        return function() { currentPage = page; renderTable(); };
                    })(i);
                    pagination.appendChild(btn);
                } else if (i === 4 && currentPage > 5) {
                    var dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.style.color = '#666';
                    dots.style.margin = '0 10px';
                    pagination.appendChild(dots);
                } else if (i === totalPages - 3 && currentPage < totalPages - 4) {
                    var dots2 = document.createElement('span');
                    dots2.textContent = '...';
                    dots2.style.color = '#666';
                    dots2.style.margin = '0 10px';
                    pagination.appendChild(dots2);
                }
            }
            
            if (currentPage < totalPages) {
                var nextBtn = document.createElement('button');
                nextBtn.className = 'page-btn';
                nextBtn.textContent = '下一页';
                nextBtn.onclick = function() { currentPage++; renderTable(); };
                pagination.appendChild(nextBtn);
            }
        }
        
        document.getElementById('filterWord').addEventListener('change', function() { currentPage = 1; renderTable(); });
        document.getElementById('filterStatus').addEventListener('change', function() { currentPage = 1; renderTable(); });
        document.getElementById('searchInput').addEventListener('input', function() { currentPage = 1; renderTable(); });
        
        window.addEventListener('load', function() {
            createParticles();
            initCharts();
            renderTable();
            setTimeout(animateNumbers, 500);
        });
